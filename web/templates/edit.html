{% extends "base.html" %}
{% block title %}Edit Resume · Resume Studio{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Edit Resume</h1>
    <p class="page-subtitle">Build and maintain your master resume</p>
  </div>
</div>

<!-- Validation errors banner -->
<div id="error-banner" class="error-banner" style="display:none" role="alert">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <span id="error-banner-text"></span>
</div>

<!-- Resume state injected for app.js -->
<script id="resume-data" type="application/json">{{ resume_json | safe }}</script>

<!-- ── Sections ──────────────────────────────────────────────── -->
<div class="sections-container">

  <!-- Personal -->
  <section class="form-section" id="section-personal" data-nav-label="Personal">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-personal" onclick="toggleSection('personal')">
      <h2 class="section-title">Personal</h2>
      <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </div>
    <div class="section-body" id="section-body-personal">
      <div class="section-body-inner">
        <div class="personal-fields" id="personal-fields"></div>
      </div>
    </div>
  </section>

  <!-- Education -->
  <section class="form-section" id="section-education" data-nav-label="Education">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-education" onclick="toggleSection('education')">
      <h2 class="section-title">
        Education
        <span class="section-count" id="edu-count"></span>
      </h2>
      <div class="section-actions">
        <button class="btn-add" onclick="event.stopPropagation();addEntry('education')">+ Add</button>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="section-body" id="section-body-education">
      <div class="section-body-inner">
        <div id="education-list"></div>
      </div>
    </div>
  </section>

  <!-- Experience -->
  <section class="form-section" id="section-experience" data-nav-label="Experience">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-experience" onclick="toggleSection('experience')">
      <h2 class="section-title">
        Experience
        <span class="section-count" id="exp-count"></span>
      </h2>
      <div class="section-actions">
        <button class="btn-add" onclick="event.stopPropagation();addEntry('experience')">+ Add</button>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="section-body" id="section-body-experience">
      <div class="section-body-inner">
        <div id="experience-list"></div>
      </div>
    </div>
  </section>

  <!-- Projects -->
  <section class="form-section" id="section-projects" data-nav-label="Projects">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-projects" onclick="toggleSection('projects')">
      <h2 class="section-title">
        Projects
        <span class="section-count" id="proj-count"></span>
      </h2>
      <div class="section-actions">
        <button class="btn-add" onclick="event.stopPropagation();addEntry('projects')">+ Add</button>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="section-body" id="section-body-projects">
      <div class="section-body-inner">
        <div id="projects-list"></div>
      </div>
    </div>
  </section>

  <!-- Skills -->
  <section class="form-section" id="section-skills" data-nav-label="Skills">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-skills" onclick="toggleSection('skills')">
      <h2 class="section-title">
        Skills
        <span class="section-count" id="skills-count"></span>
      </h2>
      <div class="section-actions">
        <button class="btn-add" onclick="event.stopPropagation();addSkillCategory()">+ Add Category</button>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="section-body" id="section-body-skills">
      <div class="section-body-inner">
        <div id="skills-list"></div>
      </div>
    </div>
  </section>

  <!-- Achievements -->
  <section class="form-section" id="section-achievements" data-nav-label="Achievements">
    <div class="section-header" role="button" tabindex="0" aria-expanded="true" aria-controls="section-body-achievements" onclick="toggleSection('achievements')">
      <h2 class="section-title">
        Achievements
        <span class="section-count" id="ach-count"></span>
      </h2>
      <div class="section-actions">
        <button class="btn-add" onclick="event.stopPropagation();addEntry('achievements')">+ Add</button>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="section-body" id="section-body-achievements">
      <div class="section-body-inner">
        <div id="achievements-list"></div>
      </div>
    </div>
  </section>

</div>

<!-- ── Sticky Save Bar ──────────────────────────────────────── -->
<div class="save-bar" id="save-bar">
  <div class="save-bar-inner">
    <div class="save-status-indicator">
      <span class="save-status-dot dot-unsaved" id="save-status-dot"></span>
      <span class="save-bar-text status-unsaved" id="save-bar-text">Unsaved changes</span>
    </div>
    <button id="save-btn" class="btn btn-primary" onclick="saveResume()">Save Changes</button>
  </div>
</div>

<script src="/static/app.js"></script>
{% endblock %}
