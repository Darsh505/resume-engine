<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Resume Engine{% endblock %}</title>
  <meta name="description" content="Local resume editor and PDF generator">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      <span class="logo-text">Resume Engine</span>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit Resume
      </a>
      <a href="/generate" class="nav-link {% if request.url.path == '/generate' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Generate PDF
      </a>
    </nav>

    <div class="sidebar-footer">
      {% if using_example %}
        <div class="data-badge data-badge-example">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Demo data
        </div>
        <p class="data-hint">Using <code>resume.example.yaml</code>.<br>
          Save edits to create your <code>resume.yaml</code>.</p>
      {% else %}
        <div class="data-badge data-badge-real">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Your data
        </div>
        <p class="data-hint">Editing <code>resume.yaml</code></p>
      {% endif %}
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Toast ───────────────────────────────────────────────────────────── -->
  <div id="toast" class="toast" aria-live="polite"></div>

</body>
</html>
